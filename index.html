<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dieta e Treino">
<meta name="theme-color" content="#1f8a5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dieta e Treino</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1d2420;--mut:#6b746e;--ac:#1f8a5b;--warn:#c4572e;--ln:#e3e6e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1d2320;--tx:#e8ece9;--mut:#9aa39d;--ac:#3fbf86;--warn:#ec8a63;--ln:#2c3430}}
:root[data-theme="dark"]{--bg:#141816;--card:#1d2320;--tx:#e8ece9;--mut:#9aa39d;--ac:#3fbf86;--warn:#ec8a63;--ln:#2c3430}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
input,select{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-top:3px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.x{background:none;color:var(--mut);padding:2px 6px}
.big{font-size:30px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center}
nav button{flex:1;max-width:110px;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}nav button.on{color:var(--ac)}
.chk{display:flex;gap:8px;align-items:center;padding:5px 0}.chk input{width:auto;margin:0}
#res{max-height:180px;overflow:auto}svg{width:100%;height:auto}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script src="alimentos.js"></script>
<script>
// ---- dados (protótipo: salvos no navegador; Supabase entra depois) ----
const KEY='dieta-treino-v1';
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{perfil:null,refeicoes:[],treinos:[],pesos:[],checks:{},agua:{},plano:{}};
const save=()=>{S._t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};agendaSync()};

// ---- Supabase (REST direto, sem biblioteca) ----
const SB_URL='https://lnfenrfbiymnfwseidbj.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuZmVucmZiaXltbmZ3c2VpZGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTIxMzYsImV4cCI6MjEwNzQ4ODEzNn0.jz4Ko-c-lEkbRIcwHrXzpnvxvTR5-f24vB8s8FXC960';
let SES;try{SES=JSON.parse(localStorage.getItem(KEY+'-ses'))}catch(e){}
const salvaSes=s=>{SES=s;try{s?localStorage.setItem(KEY+'-ses',JSON.stringify(s)):localStorage.removeItem(KEY+'-ses')}catch(e){}};
let syncMsg='';
async function auth(tipo,body){const r=await fetch(`${SB_URL}/auth/v1/${tipo}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok){const m=j.msg||j.error_description||j.message||'';
  throw new Error({'Email not confirmed':'E-mail ainda não confirmado. Procure o e-mail de confirmação (veja o spam) e clique no link.',
   'Invalid login credentials':'E-mail ou senha incorretos.','User already registered':'Este e-mail já tem conta. Toque em Entrar.',
   'missing email or phone':'Digite o e-mail.'}[m]||(/password/i.test(m)?'A senha precisa ter pelo menos 6 caracteres.':m||'Erro de login'))}return j}
async function token(){if(!SES)return null;if(SES.expires_at*1000-Date.now()>60000)return SES.access_token;
 const j=await auth('token?grant_type=refresh_token',{refresh_token:SES.refresh_token});salvaSes(j);return j.access_token}
async function rest(method,qs,body){const t=await token();const r=await fetch(`${SB_URL}/rest/v1/app_state${qs}`,{method,
 headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:body&&JSON.stringify(body)});
 if(!r.ok)throw new Error('sync '+r.status);return method==='GET'?r.json():null}
// Junta dois estados sem perder registros: listas somam (sem repetir), configurações vêm do mais recente
function junta(a,b){if(!a||!a.perfil)return b;if(!b||!b.perfil)return a;
 const [novo,velho]=(a._t||0)>=(b._t||0)?[a,b]:[b,a],r={...velho,...novo};
 const uniao=(k,id)=>{const m=new Map();[...(velho[k]||[]),...(novo[k]||[])].forEach(x=>m.set(id(x),x));return[...m.values()]};
 r.refeicoes=uniao('refeicoes',x=>x.id);r.treinos=uniao('treinos',x=>x.id);r.jejuns=uniao('jejuns',x=>x.ini);
 r.pesos=uniao('pesos',x=>x.d).sort((x,y)=>x.d<y.d?-1:1);
 r.agua={...velho.agua};Object.entries(novo.agua||{}).forEach(([d,v])=>r.agua[d]=Math.max(v,r.agua[d]||0));
 r.checks={...velho.checks};Object.entries(novo.checks||{}).forEach(([d,c])=>r.checks[d]={...(r.checks[d]||{}),...c});
 ['cardapio','plano','compras'].forEach(k=>{if(!Object.keys(novo[k]||{}).length)r[k]=velho[k]});
 r._t=Math.max(a._t||0,b._t||0);return r}
// mesclar=true só no login: junta o que estava neste aparelho com a conta. No resto, vale a versão mais recente.
async function puxa(mesclar){if(!SES)return;try{const rows=await rest('GET','?select=data&user_id=eq.'+SES.user.id);
 const rem=rows[0]&&rows[0].data;
 S=mesclar?junta(S,rem):(rem&&(rem._t||0)>(S._t||0)?rem:S);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(S.perfil&&JSON.stringify(S)!==JSON.stringify(rem))await empurra();syncMsg='✓ sincronizado'}catch(e){syncMsg='⚠ offline, salvo no aparelho'}}
async function empurra(){await rest('POST','',{user_id:SES.user.id,data:S,updated_at:new Date().toISOString()})}
let tSync;function agendaSync(){if(!SES)return;clearTimeout(tSync);tSync=setTimeout(async()=>{try{await empurra();syncMsg='✓ sincronizado'}catch(e){syncMsg='⚠ offline, salvo no aparelho'}
 const el=document.getElementById('sync');if(el)el.textContent=syncMsg},800)}
window.addEventListener('online',()=>agendaSync());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SES)puxa().then(render)});

function login(){$('#nav').innerHTML='';
 $('#app').innerHTML=`<h1>Entrar</h1><div class="card"><div class="mut" style="margin-bottom:10px">Entre para sincronizar seus dados entre celular e computador.</div>
 <label>E-mail<input id="em" type="email" autocomplete="email"></label><label>Senha (mín. 6 caracteres)<input id="pw" type="password" autocomplete="current-password"></label>
 <div id="err" style="color:var(--warn);font-size:13px;margin-bottom:8px"></div>
 <div class="grid"><button id="entrar">Entrar</button><button class="ghost" id="criar">Criar conta</button></div>
 <button class="x" id="esqueci" style="margin-top:10px">Esqueci minha senha</button></div>
 <button class="x" id="semConta">Usar sem conta (só neste aparelho)</button>`;
 const go=async tipo=>{$('#err').textContent='';try{const body={email:$('#em').value.trim(),password:$('#pw').value};
  const j=await auth(tipo==='criar'?'signup':'token?grant_type=password',body);
  if(!j.access_token)throw new Error(`Conta criada! Enviamos um link de confirmação para ${body.email} (veja também o spam). Toque no link e depois em Entrar. Até confirmar, nada fica salvo na conta.`);
  salvaSes(j);await puxa(true);render()}catch(e){$('#err').textContent=e.message}};
 $('#entrar').onclick=()=>go('entrar');$('#criar').onclick=()=>go('criar');
 $('#esqueci').onclick=async()=>{const email=$('#em').value.trim(),err=$('#err');
  if(!email){err.textContent='Digite seu e-mail acima e toque de novo em "Esqueci minha senha".';return}
  try{await auth('recover',{email});err.style.color='var(--ac)';err.textContent=`Enviamos um link para ${email}. Abra o e-mail (veja o spam) e toque no link para criar uma senha nova.`}
  catch(e){err.style.color='';err.textContent=/rate|seconds/i.test(e.message)?'Muitos pedidos seguidos. Espere um minuto e tente de novo.':e.message}};
 $('#semConta').onclick=()=>{if(!confirm('Usar sem conta?\n\nSeus registros ficarão SÓ neste aparelho e neste navegador. Eles NÃO vão para a sua conta e serão perdidos se você apagar o app da tela inicial, limpar os dados do navegador ou trocar de celular.\n\nSe você já criou uma conta, toque em Cancelar, confirme o e-mail e use Entrar.'))return;
  try{localStorage.setItem(KEY+'-local','1')}catch(e){};render()}}
// Volta dos links do e-mail (confirmação de conta ou senha nova): o Supabase manda a sessão no # da URL
async function sessaoDoLink(){const h=new URLSearchParams(location.hash.slice(1));if(!h.get('access_token')&&!h.get('error'))return null;
 history.replaceState(null,'',location.pathname+location.search);
 if(h.get('error'))return{erro:h.get('error_code')==='otp_expired'?'Este link expirou ou já foi usado. Peça um novo.':(h.get('error_description')||'Link inválido.').replace(/\+/g,' ')};
 const at=h.get('access_token'),r=await fetch(`${SB_URL}/auth/v1/user`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+at}});if(!r.ok)return{erro:'Não foi possível validar o link. Peça um novo.'};
 salvaSes({access_token:at,refresh_token:h.get('refresh_token'),expires_at:+h.get('expires_at')||Date.now()/1000+3600,user:await r.json()});return{tipo:h.get('type')}}
function novaSenha(){$('#nav').innerHTML='';
 $('#app').innerHTML=`<h1>Nova senha</h1><div class="card"><div class="mut" style="margin-bottom:10px">Conta: ${esc(SES.user.email)}</div>
 <label>Nova senha (mín. 6 caracteres)<input id="np1" type="password" autocomplete="new-password"></label><label>Repita a senha<input id="np2" type="password" autocomplete="new-password"></label>
 <div id="err" style="color:var(--warn);font-size:13px;margin-bottom:8px"></div><button id="salvaSenha">Salvar senha</button></div>`;
 $('#salvaSenha').onclick=async()=>{const a=$('#np1').value,b=$('#np2').value;if(a.length<6)return $('#err').textContent='A senha precisa ter pelo menos 6 caracteres.';
  if(a!==b)return $('#err').textContent='As senhas não são iguais.';
  const r=await fetch(`${SB_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SB_KEY,Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify({password:a})});
  if(!r.ok){const j=await r.json().catch(()=>({}));return $('#err').textContent=/different/i.test(j.msg||'')?'Use uma senha diferente da anterior.':(j.msg||'Não foi possível salvar.')}
  alert('Senha alterada!');await puxa(true);render()}}
const modoLocal=()=>{try{return localStorage.getItem(KEY+'-local')==='1'}catch(e){return false}};
const dataLocal=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hoje=()=>dataLocal(new Date());

const PLANOS={eq:{n:"Equilibrado",p:1.6,regras:["4 refeições","Metade do prato com vegetais","Ultraprocessados no máx. 1x"]},
 hp:{n:"Alto em proteína",p:2.0,regras:["Proteína em todas as refeições","Carboidrato até 2 h antes do treino","Proteína no pós-treino"]},
 lc:{n:"Low carb moderado",p:1.8,regras:["Sem açúcar e farinha branca","Carboidrato só no pré/pós-treino","Carboidrato ≤ 100 g"]}};
const MET={"Academia|moderada":5,"Academia|intensa":6,"Crossfit|intensa":8,"Crossfit|moderada":6,"Corrida|leve (8 km/h)":8,"Corrida|moderada (10 km/h)":9.8,
 "Corrida|forte (12 km/h)":11.8,"Lutas|técnico":5.3,"Lutas|sparring":10.3,
 "Natação|leve":6,"Natação|moderada":8.3,"Natação|intensa":9.8,"Ciclismo|leve (até 16 km/h)":4,"Ciclismo|moderado (16–19 km/h)":6.8,
 "Ciclismo|intenso (20–22 km/h)":8,"Ciclismo|bike ergométrica":6.8,"Funcional|moderado":4.3,"Funcional|intenso":8};
const MODALIDADES=[...new Set(Object.keys(MET).map(k=>k.split('|')[0]))];
const ATIV={"1.2":"Sedentário","1.375":"Leve","1.55":"Moderado","1.725":"Intenso"};

// ---- cálculos ----
function pesoAtual(){return S.pesos.length?S.pesos[S.pesos.length-1].kg:S.perfil.peso}
function tendencia(){let t=null;return S.pesos.map(p=>(t=t==null?p.kg:t+0.1*(p.kg-t),{d:p.d,kg:p.kg,t}))}
function metaBase(){const p=S.perfil,kg=pesoAtual();const tmb=10*kg+6.25*p.altura-5*p.idade+(p.sexo==='m'?5:-161);
 const tdee=tmb*p.ativ;return Math.round(tdee+(p.obj==='perder'?-400:p.obj==='ganhar'?300:0))}
function ajusteSemanal(){ // gasto real estimado pelos últimos 14 dias
 const tr=tendencia();if(tr.length<2)return null;const a=tr[Math.max(0,tr.length-15)],b=tr[tr.length-1];
 const dias=(new Date(b.d)-new Date(a.d))/864e5;if(dias<7)return null;
 const cons=S.refeicoes.filter(r=>r.d>a.d&&r.d<=b.d);if(!cons.length)return null;
 const ds=new Set(cons.map(r=>r.d)).size,media=cons.reduce((s,r)=>s+r.kcal,0)/ds;
 const gasto=media-((b.t-a.t)*7700)/dias;const p=S.perfil;
 return {gasto:Math.round(gasto),meta:Math.round(gasto+(p.obj==='perder'?-400:p.obj==='ganhar'?300:0)),perdaSem:(a.t-b.t)/dias*7}}
function meta(){const a=ajusteSemanal();return a?a.meta:metaBase()}
function protMeta(){return Math.round(PLANOS[S.perfil.plano].p*pesoAtual())}
function dia(d){const r=S.refeicoes.filter(x=>x.d===d),t=S.treinos.filter(x=>x.d===d),soma=k=>r.reduce((s,x)=>s+(x[k]||0),0);
 return {kcal:soma('kcal'),prot:soma('prot'),carb:soma('carb'),gord:soma('gord'),gasto:t.reduce((s,x)=>s+x.kcal,0),r,t}}
// Corrida acima de 60 min no dia: low carb libera 1 g/kg de carboidrato extra no pós-treino
const corridaLonga=d=>dia(d).t.some(x=>x.mod.startsWith('Corrida')&&x.min>60);
// Metas de macros (g) sobre as calorias liberadas no dia: meta + gasto no treino
function macros(d){const kg=pesoAtual(),pl=S.perfil.plano,kcal=meta()+dia(d).gasto,prot=protMeta();let carb,gord,extra=0;
 if(pl==='lc'){extra=corridaLonga(d)?Math.round(kg):0;carb=100+extra;gord=(kcal-prot*4-carb*4)/9}
 else{gord=kcal*(pl==='eq'?0.275:0.25)/9;carb=(kcal-prot*4-gord*9)/4}
 return {kcal,prot,carb:Math.max(0,Math.round(carb)),gord:Math.max(0,Math.round(gord)),extra}}
function sequencia(){let n=0,d=new Date();for(;;){const k=dataLocal(d),x=dia(k);
 if(x.r.length&&x.t.length)n++;else if(k!==hoje())break;d.setDate(d.getDate()-1);if(n>999)break}return n}

// ---- telas ----
let aba='painel';
const $=s=>document.querySelector(s);const f=n=>Math.round(n).toLocaleString('pt-BR');
const pct=(a,b)=>Math.max(0,Math.min(100,b?a/b*100:0));

function cadastro(){
 $('#nav').innerHTML='';
 $('#app').innerHTML=`<h1>Bem-vindo 👋</h1><div class="card"><h2>Seu perfil</h2><div class="grid">
 <label>Peso (kg)<input id="peso" type="number" step="0.1" value="80"></label><label>Altura (cm)<input id="alt" type="number" value="175"></label>
 <label>Idade<input id="idade" type="number" value="30"></label><label>Sexo<select id="sexo"><option value="m">Masculino</option><option value="f">Feminino</option></select></label>
 <label>Atividade<select id="ativ">${Object.entries(ATIV).map(([k,v])=>`<option value="${k}" ${k=='1.55'?'selected':''}>${v}</option>`).join('')}</select></label>
 <label>Objetivo<select id="obj"><option value="perder">Perder peso</option><option value="manter">Manter</option><option value="ganhar">Ganhar</option></select></label>
 <label>Peso-meta (kg)<input id="pmeta" type="number" step="0.1" value="75"></label>
 <label>Plano<select id="plano">${Object.entries(PLANOS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select></label>
 </div><button id="ok">Começar</button></div>`;
 $('#ok').onclick=()=>{const v=id=>$('#'+id).value;
  S.perfil={peso:+v('peso'),altura:+v('alt'),idade:+v('idade'),sexo:v('sexo'),ativ:+v('ativ'),obj:v('obj'),pmeta:+v('pmeta'),plano:v('plano')};
  S.pesos=[{d:hoje(),kg:+v('peso')}];save();render()}}

function painel(){const d=dia(hoje()),m=meta(),saldo=d.kcal-d.gasto,mc=macros(hoje()),pl=PLANOS[S.perfil.plano];
 const ch=S.checks[hoje()]||{},agua=S.agua[hoje()]||0,aguaMeta=Math.round(pesoAtual()*35);
 return `<h1>Hoje</h1><div class="card"><div class="mut">Saldo do dia</div><div class="big">${f(saldo)} / ${f(m)} kcal</div>
 <div class="bar"><i style="width:${pct(saldo,m)}%;${saldo>m?'background:var(--warn)':''}"></i></div>
 <div class="mut">Consumido ${f(d.kcal)} · Gasto no treino ${f(d.gasto)} · Restam ${f(m-saldo)}</div></div>
 <div class="card"><h2>Macros</h2><div class="grid">${[['Proteína',d.prot,mc.prot],['Carboidrato',d.carb,mc.carb],['Gordura',d.gord,mc.gord]].map(([n,v,a])=>
  `<div><div class="mut">${n}</div><b>${f(v)} / ${f(a)} g</b><div class="bar"><i style="width:${pct(v,a)}%;${v>a*1.05&&n!=='Proteína'?'background:var(--warn)':''}"></i></div></div>`).join('')}
  <div><div class="mut">Sequência</div><b>🔥 ${sequencia()} dia(s)</b><div class="mut">refeição + treino</div></div></div>
  ${mc.extra?`<div class="mut" style="margin-top:8px">🏃 Corrida acima de 60 min hoje: +${mc.extra} g de carboidrato liberados no pós-treino.</div>`:''}</div>
 <div class="card"><h2>Checklist · ${pl.n}</h2>${pl.regras.map((r,i)=>S.perfil.plano==='lc'&&i===2
  ?`<label class="chk"><input type="checkbox" disabled ${d.r.length&&d.carb<=mc.carb?'checked':''}>Carboidrato ≤ ${mc.carb} g <span class="mut">(hoje ${f(d.carb)} g · automático)</span></label>`
  :`<label class="chk"><input type="checkbox" data-c="${i}" ${ch[i]?'checked':''}>${r}</label>`).join('')}
 <div class="row"><span>💧 Água ${f(agua)} / ${f(aguaMeta)} ml</span><button class="ghost" id="agua">+250 ml</button></div></div>
 ${cardJejum()}`}

const TIPOS=['Café da manhã','Almoço','Lanche','Jantar'];
// Refeição sugerida pelo horário; a escolha manual vale até recarregar
let tipoSel=null;const tipoAuto=()=>{const h=new Date().getHours();return h<10?TIPOS[0]:h<15?TIPOS[1]:h<19?TIPOS[2]:TIPOS[3]};
const pcg=(p,c,g)=>`P ${f(p)} · C ${f(c)} · G ${f(g)} g`;
function alimentacao(){const d=dia(hoje()),mc=macros(hoje()),tipo=tipoSel||tipoAuto();
 const linha=(n,v,a)=>`<div><div class="mut">${n}</div><b>${f(v)} / ${f(a)}</b><div class="bar"><i style="width:${pct(v,a)}%;${v>a*1.05&&n!=='Proteína g'?'background:var(--warn)':''}"></i></div></div>`;
 const grupos=TIPOS.concat(d.r.map(r=>r.tipo).filter(t=>!TIPOS.includes(t))).map(t=>[t,d.r.filter(r=>r.tipo===t)]).filter(([,rs])=>rs.length);
 return `<h1>Alimentação</h1><div class="card"><h2>Registrar refeição</h2>
 <label>Refeição<select id="tipo">${TIPOS.map(t=>`<option ${t===tipo?'selected':''}>${t}</option>`).join('')}</select></label>
 <label>Buscar alimento (${TACO.length.toLocaleString('pt-BR')} na base TACO/IBGE)<input id="busca" placeholder="ex.: arroz cozido, frango grelhado" autocomplete="off"></label><div id="res"></div></div>
 ${favoritos()}
 <div class="card"><h2>Hoje</h2><div class="grid">${linha('Calorias kcal',d.kcal,mc.kcal)}${linha('Proteína g',d.prot,mc.prot)}${linha('Carboidrato g',d.carb,mc.carb)}${linha('Gordura g',d.gord,mc.gord)}</div></div>
 ${grupos.map(([t,rs])=>{const s=k=>rs.reduce((a,r)=>a+(r[k]||0),0);

function grafico(tr){if(tr.length<2)return'<div class="mut">Precisa de 2+ pesagens.</div>';

 return `<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${tr.map((p,i)=>x(i)+','+y(p.t)).join(' ')}"/>

function cardLembretes(){const L=S.lembretes,sup='Notification' in window;
 return`<div class="card"><h2>🔔 Lembretes</h2>${!sup?'<div class="mut">Este navegador não suporta notificações.</div>':`
  ${[['agua','Beber água (a cada 2 h, se estiver abaixo do ritmo)'],['refeicoes','Refeição não registrada (9h, 13h, 17h, 21h)'],['jejum','Fim do jejum']].map(([k,t])=>`<label class="chk"><input type="checkbox" data-lb="${k}" ${L[k]?'checked':''}>${t}</label>`).join('')}
  <div class="mut">${Notification.permission==='denied'?'⚠ Notificações bloqueadas nas configurações do navegador.':'Funcionam com o app aberto ou em segundo plano no aparelho.'}</div>`}</div>`}
function bindLembretes(){document.querySelectorAll('[data-lb]').forEach(c=>c.onchange=async()=>{
 if(c.checked&&Notification.permission!=='granted'&&await Notification.requestPermission()!=='granted'){c.checked=false;return render()}
 S.lembretes[c.dataset.lb]=c.checked;save();if(c.checked)notifica('🔔 Lembretes ativados','Você vai receber avisos deste app.','teste')})}

const ABAS={painel:['🏠','Hoje',painel],alimentacao:['🍽️','Comida',alimentacao],cardapio:['📋','Cardápio',cardapio],treinos:['🏋️','Treinos',treinos],evolucao:['📈','Evolução',evolucao]};
function render(){if(!SES&&!modoLocal())return login();if(!S.perfil)return cadastro();normaliza();
 $('#nav').innerHTML=Object.entries(ABAS).map(([k,[i,n]])=>`<button class="${k===aba?'on':''}" data-aba="${k}">${i}<br>${n}</button>`).join('');
 $('#app').innerHTML=(SES?'':`<div class="card" style="border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--card))">
  <b style="color:var(--warn)">⚠ Seus dados estão só neste aparelho</b><div class="mut" style="margin:4px 0 8px">Você está usando sem conta. Se apagar o app ou limpar o navegador, tudo será perdido.</div>
  <button id="avisoEntrar">Entrar ou criar conta</button></div>`)+(aba==='evolucao'?'':cardInstalar(false))+ABAS[aba][2]();bind();bindInstalar();
 if($('#avisoEntrar'))$('#avisoEntrar').onclick=()=>{try{localStorage.removeItem(KEY+'-local')}catch(e){};render()}}

// ---- instalar na tela inicial ----
// Android/Chrome/Edge: o navegador entrega o pedido de instalação (beforeinstallprompt) e o botão abre a janela nativa.
// iPhone/iPad: não existe instalação automática; mostramos o passo a passo do botão Compartilhar.
let pedidoInstalar=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedidoInstalar=e;if(S&&S.perfil)render()});
window.addEventListener('appinstalled',()=>{pedidoInstalar=null;render()});
const instalado=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ehIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const adiado=()=>{try{return Date.now()<+(localStorage.getItem(KEY+'-instalarDepois')||0)}catch(e){return false}};
// fixo=false: aparece no topo de todas as abas (some por 7 dias em "Agora não"); true: card fixo na aba Evolução
function cardInstalar(fixo){if(instalado()||(!fixo&&adiado()))return'';
 const passos=ehIOS()?`<ol style="margin:6px 0 8px;padding-left:20px;font-size:14px">
   <li>Toque em <b>Compartilhar</b> <span style="display:inline-block;border:1.5px solid currentColor;border-radius:4px;padding:0 4px;font-size:12px">⬆</span> na barra do Safari</li>
   <li>Role e toque em <b>Adicionar à Tela de Início</b></li><li>Toque em <b>Adicionar</b></li></ol>
   <div class="mut" style="margin-bottom:8px">No iPhone funciona pelo Safari. Depois, abra pelo ícone e entre com a sua conta.</div>`
  :pedidoInstalar?`<div class="mut" style="margin:4px 0 8px">Abra direto da tela inicial, em tela cheia e sem a barra do navegador.</div><button id="btnInstalar">📲 Instalar agora</button>`
  :fixo?`<div class="mut" style="margin:4px 0 8px">No menu do navegador (⋮), toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</div>`:null;
 if(passos===null)return'';
 return`<div class="card"><div class="row" style="border:0;padding:0"><b>📲 Adicione o app à tela inicial</b>${fixo?'':'<button class="x" id="instalarDepois">Agora não</button>'}</div>${passos}</div>`}
function bindInstalar(){
 if($('#btnInstalar'))$('#btnInstalar').onclick=async()=>{if(!pedidoInstalar)return;pedidoInstalar.prompt();await pedidoInstalar.userChoice;pedidoInstalar=null;render()};
 if($('#instalarDepois'))$('#instalarDepois').onclick=()=>{try{localStorage.setItem(KEY+'-instalarDepois',Date.now()+7*864e5)}catch(e){};render()}}
function bind(){
 document.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{aba=b.dataset.aba;render();scrollTo(0,0)});
 bindCardapio();bindLembretes();
 if($('#jIni'))$('#jIni').onclick=()=>{const h=+$('#jProt').value;S.jejumPadrao=h;S.jejum={ini:Date.now(),horas:h};save();render()};
 if($('#jFim'))$('#jFim').onclick=()=>{if(!confirm('Encerrar o jejum agora?'))return;S.jejuns.push({...S.jejum,fim:Date.now()});S.jejum=null;save();render()};
 document.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{(S.checks[hoje()]=S.checks[hoje()]||{})[c.dataset.c]=c.checked;save()});
 if($('#agua'))$('#agua').onclick=()=>{S.agua[hoje()]=(S.agua[hoje()]||0)+250;save();render()};
 if($('#busca'))$('#busca').oninput=e=>{const termos=semAcento(e.target.value).split(/\s+/).filter(Boolean);
  if(termos.join('').length<2){$('#res').innerHTML='';return}
  const ach=buscaAlim(e.target.value);
  $('#res').innerHTML=ach.map(i=>{const t=TACO[i];return`<div class="row"><span>${esc(t[0])}<br><span class="mut">${t[1]} kcal · P ${t[2]} · C ${t[3]} · G ${t[4]} g /100 g</span></span><span style="display:flex;gap:6px"><input type="number" value="100" style="width:70px" data-g="${i}"><button data-add="${i}">+</button></span></div>`}).join('')
  ||'<div class="mut">Não encontrado.</div>';
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addAlimento(TACO[b.dataset.add],document.querySelector(`[data-g="${b.dataset.add}"]`).value));
  // Enter no campo de gramas registra; o valor mostrado acompanha as gramas digitadas
  document.querySelectorAll('[data-g]').forEach(inp=>{inp.onkeydown=ev=>{if(ev.key==='Enter')addAlimento(TACO[inp.dataset.g],inp.value)};
   inp.oninput=()=>{const t=TACO[inp.dataset.g],g=+inp.value||0;inp.closest('.row').querySelector('.mut').textContent=`${f(t[1]*g/100)} kcal · ${pcg(t[2]*g/100,t[3]*g/100,t[4]*g/100)} em ${g} g`}})};
 if($('#tipo'))$('#tipo').onchange=e=>{tipoSel=e.target.value};
 document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editaGramas(b.dataset.ed));
 document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const r=FAV[b.dataset.fav];
  addAlimento([r.nome,r.kcal/r.g*100,r.prot/r.g*100,(r.carb||0)/r.g*100,(r.gord||0)/r.g*100],r.g)});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.refeicoes=S.refeicoes.filter(r=>r.id!=b.dataset.del);save();render()});
 document.querySelectorAll('[data-delt]').forEach(b=>b.onclick=()=>{S.treinos=S.treinos.filter(r=>r.id!=b.dataset.delt);save();render()});
 if($('#addT'))$('#addT').onclick=()=>{const mod=$('#mod').value,min=+$('#dur').value;
  S.treinos.push({id:Date.now(),d:hoje(),mod,min,kcal:MET[mod]*pesoAtual()*min/60});save();render()};
 document.querySelectorAll('[data-pl]').forEach(s=>s.onchange=()=>{S.plano[s.dataset.pl]=s.value;save()});
 if($('#addP'))$('#addP').onclick=()=>{const kg=+$('#kg').value;S.pesos=S.pesos.filter(p=>p.d!==hoje());S.pesos.push({d:hoje(),kg});save();render()};
 if($('#trocaPlano'))$('#trocaPlano').onchange=e=>{S.perfil.plano=e.target.value;save()};
 if($('#reset'))$('#reset').onclick=()=>{if(confirm('Apagar todos os dados?')){S={perfil:null,refeicoes:[],treinos:[],pesos:[],checks:{},agua:{},plano:{}};save();aba='painel';render()}};
 if($('#sair'))$('#sair').onclick=()=>{salvaSes(null);try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'-local')}catch(e){}
  S={perfil:null,refeicoes:[],treinos:[],pesos:[],checks:{},agua:{},plano:{}};aba='painel';render()};
 if($('#logar'))$('#logar').onclick=()=>{try{localStorage.removeItem(KEY+'-local')}catch(e){};render()};
}
sessaoDoLink().then(async r=>{if(r&&r.tipo==='recovery')return novaSenha();
 render();if(r&&r.erro&&$('#err'))$('#err').textContent=r.erro;if(SES){await puxa(!!(r&&r.tipo));render()}}).catch(()=>render());
</script>
</body>
</html>
